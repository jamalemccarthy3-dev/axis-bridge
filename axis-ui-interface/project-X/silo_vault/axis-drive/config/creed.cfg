# --- AXIS DRIVE CREED (v1.0) ---
# This file is the immutable rulebook for the engine.

[SYSTEM_STABILITY]
MAX_RETRY_ATTEMPTS = 2
FAIL_SAFE_MODE = ENABLED
LOG_LEVEL = VERBOSE

[SECURITY_PROTOCOL]
INTEGRITY_CHECK = STRICT
LOCK_DOWN_ON_FAILURE = TRUE
PROTECTION_LEVEL = MAXIMUM

[BUILD_ENVIRONMENT]
VERSION_ID = AXIS_01
COMPILE_TARGET = LOCAL_LB
ALLOW_EXTERNAL_WRITE = FALSE

[INTERFACE]
NOTIFY_ON_SEAL = TRUE
AUTO_CLEANUP_TEMP = TRUE
