<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Keys</title>
<style>
  :root { --bg:#0b0d12; --card:#12151c; --line:#232834; --text:#e6e8ee; --dim:#8b93a7; --ok:#34d399; --warn:#fbbf24; --accent:#22d3ee; }
  @media (prefers-color-scheme: light) { :root { --bg:#f5f6f9; --card:#fff; --line:#dde1ea; --text:#161a23; --dim:#5d667a; --ok:#047857; --warn:#b45309; --accent:#0e7490; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, Segoe UI, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:22px; margin:0 0 4px; } h2 { font-size:15px; margin:0; text-transform:uppercase; letter-spacing:.08em; }
  p.lead { color:var(--dim); margin:0 0 24px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:18px; }
  .group { color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; margin:16px 0 4px; }
  .row { display:grid; grid-template-columns:1fr; gap:6px; padding:12px 0; border-top:1px solid var(--line); }
  .row:first-of-type { border-top:0; }
  .top { display:flex; justify-content:space-between; gap:12px; align-items:baseline; flex-wrap:wrap; }
  .label { font-weight:600; } .name { color:var(--dim); font:12px ui-monospace, Consolas, monospace; }
  .badge { font-size:11px; padding:2px 9px; border-radius:99px; border:1px solid var(--line); white-space:nowrap; }
  .badge.set { color:var(--ok); border-color:var(--ok); } .badge.unset { color:var(--warn); border-color:var(--warn); }
  .help { color:var(--dim); font-size:13px; }
  form { display:flex; gap:8px; } input { flex:1; min-width:0; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:9px; padding:9px 11px; font:inherit; }
  input:focus { outline:2px solid var(--accent); outline-offset:1px; }
  button { background:var(--accent); color:#04141a; border:0; border-radius:9px; padding:9px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  button:disabled { opacity:.5; cursor:default; }
  .msg { font-size:13px; min-height:18px; } .msg.err { color:#f87171; } .msg.good { color:var(--ok); }
  .empty { color:var(--dim); }
  .restart { margin-top:10px; display:none; align-items:center; gap:10px; font-size:13px; color:var(--warn); }
</style>
</head>
<body>
<main>
  <h1>Keys</h1>
  <p class="lead">Paste a key and it is saved straight into that module's own settings file. This page never shows a saved secret, keeps no copy, and only works from this computer.</p>
  <div id="app"><p class="empty">Loading...</p></div>
</main>
<script>
const TOKEN = "__TOKEN__";
const app = document.getElementById("app");

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) { if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v); }
  for (const kid of kids) e.append(kid);
  return e;
}

async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json", "X-Keys-Token": TOKEN }, body: JSON.stringify(body) } : undefined);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("Request failed (" + res.status + ")"));
  return data;
}

function keyRow(mod, key, restartBox) {
  const badge = el("span", { class: "badge " + (key.set ? "set" : "unset") }, key.set ? "set" : "not set");
  const msg = el("div", { class: "msg" });
  const input = el("input", { type: key.secret ? "password" : "text", autocomplete: "off", spellcheck: "false",
    placeholder: key.set ? (key.secret ? "Paste a new value to replace it" : "") : "Paste it here", value: key.secret ? "" : (key.value || "") });
  const save = el("button", { type: "submit" }, "Save");
  const form = el("form", { onsubmit: async (ev) => {
    ev.preventDefault();
    const value = input.value.trim();
    if (!value && !key.set) { msg.className = "msg err"; msg.textContent = "Nothing to save."; return; }
    save.disabled = true; msg.className = "msg"; msg.textContent = "Saving...";
    try {
      const r = await api("/api/keys/save", { module: mod.name, name: key.name, value });
      badge.className = "badge " + (r.set ? "set" : "unset"); badge.textContent = r.set ? "set" : "not set";
      if (key.secret) { input.value = ""; input.placeholder = "Paste a new value to replace it"; }
      msg.className = "msg good"; msg.textContent = r.set ? "Saved." : "Cleared.";
      if (r.restart) restartBox.style.display = "flex";
    } catch (e) { msg.className = "msg err"; msg.textContent = e.message; }
    save.disabled = false;
  } }, input, save);
  const top = el("div", { class: "top" }, el("div", {}, el("span", { class: "label" }, key.label + " "), el("span", { class: "name" }, key.name)), badge);
  const row = el("div", { class: "row" }, top);
  if (key.help) { const h = el("div", { class: "help" }); h.textContent = key.help; row.append(h); }
  row.append(form, msg);
  return row;
}

function moduleCard(mod) {
  const restartMsg = el("span", {});
  const restartBtn = el("button", { class: "ghost", type: "button", onclick: async () => {
    restartBtn.disabled = true; restartMsg.textContent = "Restarting " + mod.title + "...";
    try { await api("/api/keys/restart", { module: mod.name }); restartMsg.textContent = mod.title + " is restarting; give it about 10 seconds."; }
    catch (e) { restartMsg.textContent = "Could not restart it (" + e.message + "). Restart it from the launcher."; }
    restartBtn.disabled = false;
  } }, "Restart " + mod.title);
  const restartBox = el("div", { class: "restart" }, el("span", {}, mod.title + " reads new keys when it starts."), restartBtn, restartMsg);
  const card = el("section", {}, el("h2", {}, mod.title));
  let lastGroup = null;
  for (const key of mod.keys) {
    if (key.group && key.group !== lastGroup) { card.append(el("div", { class: "group" }, key.group)); lastGroup = key.group; }
    card.append(keyRow(mod, key, restartBox));
  }
  card.append(restartBox);
  return card;
}

(async function () {
  try {
    const data = await api("/api/keys");
    app.replaceChildren();
    if (!data.modules.length) app.append(el("p", { class: "empty" }, "No module has declared any keys yet."));
    for (const m of data.modules) app.append(moduleCard(m));
  } catch (e) { app.replaceChildren(el("p", { class: "empty" }, "Could not load: " + e.message)); }
})();
</script>
</body>
</html>
