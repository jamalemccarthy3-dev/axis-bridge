<!doctype html><meta charset=utf-8>
<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;background:#0b0b0c;position:relative;font-family:'Segoe UI',Arial,sans-serif;
 display:flex;flex-direction:column;align-items:center;justify-content:center}
.grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:overlay}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(255,255,255,.07),rgba(0,0,0,.75) 85%)}
.rule{position:absolute;left:60px;right:60px;height:1px;background:linear-gradient(90deg,transparent,#8a8d91,transparent)}
.silver{background:linear-gradient(180deg,#fdfdfe 0%,#c9ccd0 30%,#6f7378 48%,#d9dcdf 62%,#8b8f94 100%);
 -webkit-background-clip:text;background-clip:text;color:transparent}
.logo{font-size:190px;font-weight:900;letter-spacing:14px;line-height:1;position:relative;
 filter:drop-shadow(0 3px 0 rgba(0,0,0,.9)) drop-shadow(0 0 28px rgba(200,205,210,.18))}
.logo .ai{font-weight:300;letter-spacing:4px;font-size:150px}
.tag{margin-top:26px;font-size:25px;letter-spacing:7px;text-transform:uppercase;color:#a3a7ac;position:relative}
.soon{position:absolute;bottom:52px;display:flex;gap:26px;align-items:center;font-size:21px;letter-spacing:4px;color:#c5c8cc;text-transform:uppercase}
.soon b{border:1px solid #8a8d91;padding:9px 20px;color:#eceef0;background:rgba(255,255,255,.04)}
.soon i{font-style:normal;color:#7b7f84}
</style>
<body>
<svg class=grain width=1280 height=640><filter id=n><feTurbulence type=fractalNoise baseFrequency=".9" numOctaves=2 stitchTiles=stitch /><feColorMatrix type=saturate values=0 /></filter><rect width=100% height=100% filter=url(#n) /></svg>
<div class=vig></div>
<div class=rule style="top:46px"></div><div class=rule style="bottom:30px"></div>
<div class="logo silver">NEXXUS<span class="ai">.ai</span></div>
<div class=tag>Autonomous Automation AI Infrastructure</div>
<div class=soon><b>Free starter kit &middot; coming soon</b><i>~2&ndash;3 weeks</i><span>Blueprint skeleton: open now</span></div>
</body>
